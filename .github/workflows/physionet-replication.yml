name: Fresh measured-value replication
on:
  pull_request:
    paths:
      - 'src/iatonoesis/measured_replication.py'
      - 'tests/test_measured_replication.py'
      - '.github/workflows/physionet-replication.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.2'
      - name: Execute fresh sample aggregate-only benchmark
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          mkdir -p artifacts/replication
          python --version > artifacts/replication/environment.txt
          git rev-parse HEAD >> artifacts/replication/environment.txt
          python -m pytest -q tests/test_measured_replication.py --cov=iatonoesis.measured_replication --cov-report=
          python -m coverage run --append --source=iatonoesis.measured_replication -m iatonoesis.measured_replication --revision "$(git rev-parse HEAD)" --output artifacts/replication/aggregate.json
          python -m coverage xml -o artifacts/replication/coverage.xml
          sha256sum artifacts/replication/aggregate.json > artifacts/replication/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fresh-measured-aggregate-${{ github.sha }}
          path: artifacts/replication/
          if-no-files-found: error
          retention-days: 30
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: artifacts/replication/coverage.xml
          disable_search: true
          flags: measured_replication
          use_oidc: true
          fail_ci_if_error: true
