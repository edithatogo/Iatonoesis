name: Bounded PhysioNet measured-value benchmark
on:
  pull_request:
    paths:
      - 'src/iatonoesis/measured_pilot.py'
      - 'tests/test_measured_pilot.py'
      - 'research/protocols/physionet-measured-value-pilot-v0.1.0.md'
      - '.github/workflows/physionet-measured-value-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15.2"
      - name: Execute fixed-sample technical benchmark in memory
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/measured
          python --version > artifacts/measured/environment.txt
          git rev-parse HEAD >> artifacts/measured/environment.txt
          python -m iatonoesis.measured_pilot --revision "$(git rev-parse HEAD)" --output artifacts/measured/aggregate.json
          sha256sum artifacts/measured/aggregate.json > artifacts/measured/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: physionet-measured-aggregate-${{ github.sha }}
          path: artifacts/measured/
          if-no-files-found: error
          retention-days: 30
