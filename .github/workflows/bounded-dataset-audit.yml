name: Bounded dataset source audit
on:
  workflow_dispatch:
  push:
    branches: ['research/bounded-trialgpt-pubtables-audit']
    paths:
      - 'src/iatonoesis/dataset_audit.py'
      - 'tests/test_dataset_audit.py'
      - '.github/workflows/bounded-dataset-audit.yml'
  pull_request:
    paths:
      - 'src/iatonoesis/dataset_audit.py'
      - 'tests/test_dataset_audit.py'
      - '.github/workflows/bounded-dataset-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Install pinned Parquet reader for this isolated audit
        run: |
          python -m pip install --only-binary=:all: pyarrow==20.0.0
      - name: Verify public source bytes and aggregate metadata
        env:
          PYTHONPATH: src
        run: python -m iatonoesis.dataset_audit --output dataset-audit.json
      - name: Retain aggregate receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bounded-dataset-audit
          path: dataset-audit.json
          if-no-files-found: error
          retention-days: 30
