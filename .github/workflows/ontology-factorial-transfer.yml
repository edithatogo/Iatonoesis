name: Ontology factorial and GNN transfer
on:
  pull_request:
    paths:
      - 'src/iatonoesis/ontology_factorial.py'
      - 'tests/test_ontology_factorial.py'
      - '.github/workflows/ontology-factorial-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  ontology-factorial:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Isolated CPU runtime
        run: |
          python -m pip install --only-binary=:all: 'pytest==9.0.2' 'pytest-cov==7.0.0' 'numpy==2.2.6' 'transformers==4.57.6' 'huggingface-hub==0.36.0' 'safetensors==0.6.2'
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
      - name: Run dedicated tests and coverage
        run: |
          set -euo pipefail
          mkdir -p artifacts/ontology
          python -m pip freeze > artifacts/ontology/environment.txt
          git rev-parse HEAD >> artifacts/ontology/environment.txt
          python -m pytest -q tests/test_ontology_factorial.py --cov=iatonoesis.ontology_factorial --cov=test_ontology_factorial --cov-report=xml:artifacts/ontology/coverage.xml --cov-fail-under=90
      - name: Replay historical published releases and SapBERT
        run: |
          set -euo pipefail
          python -m iatonoesis.ontology_factorial --output artifacts/ontology/result.json
          sha256sum artifacts/ontology/result.json > artifacts/ontology/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ontology-factorial-transfer-aggregate
          path: artifacts/ontology/
          if-no-files-found: error
          retention-days: 30
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        if: always()
        with:
          files: artifacts/ontology/coverage.xml
          disable_search: true
          flags: neural_cpu
          use_oidc: true
          fail_ci_if_error: true
