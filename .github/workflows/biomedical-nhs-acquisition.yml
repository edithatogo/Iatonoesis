name: Biomedical and NHS source acquisition
on:
  pull_request:
    paths:
      - 'src/iatonoesis/biomedical_sources.py'
      - 'tests/test_biomedical_sources.py'
      - 'research/protocols/biomedical-nhs-acquisition-v0.1.0.md'
      - '.github/workflows/biomedical-nhs-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquisition:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.2'
      - name: Audit publisher sources independently
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts/sources
          python --version > artifacts/sources/environment.txt
          git rev-parse HEAD >> artifacts/sources/environment.txt
          python -m iatonoesis.biomedical_sources --revision "$(git rev-parse HEAD)" --output artifacts/sources/aggregate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: biomedical-nhs-source-audit-${{ github.sha }}
          path: artifacts/sources/
          if-no-files-found: error
          retention-days: 30
