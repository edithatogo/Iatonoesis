name: PhysioNet 2012 observation-process benchmark
on:
  pull_request:
    paths:
      - 'src/iatonoesis/physionet2012.py'
      - 'tests/test_physionet2012.py'
      - 'tests/test_physionet2012_grouped.py'
      - 'src/iatonoesis/physionet2012_grouped.py'
      - 'research/protocols/physionet2012-grouped-v0.2.0.md'
      - 'research/protocols/physionet2012-observation-process-v0.1.0.md'
      - '.github/workflows/physionet2012-observation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.2'
      - name: Audit complete public A/B archives and evaluate recording propensity
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p12
          python --version > artifacts/p12/environment.txt
          git rev-parse HEAD >> artifacts/p12/environment.txt
          python -m iatonoesis.physionet2012_grouped --revision "$(git rev-parse HEAD)" --output artifacts/p12/aggregate.json
          sha256sum artifacts/p12/aggregate.json > artifacts/p12/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: physionet2012-observation-${{ github.sha }}
          path: artifacts/p12/
          if-no-files-found: error
          retention-days: 30
