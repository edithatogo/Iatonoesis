name: TrialGPT candidate component freeze
on:
  pull_request:
    paths:
      - 'src/iatonoesis/trialgpt_freeze.py'
      - 'tests/test_trialgpt_freeze.py'
      - '.github/workflows/trialgpt-candidate-freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Install isolated reader
        run: |
          python -m pip install --only-binary=:all: pyarrow==20.0.0
      - name: Verify exact source and deterministic candidate metadata
        run: |
          set -euo pipefail
          python -m iatonoesis.trialgpt_freeze --output candidate-partition.json
          python -m iatonoesis.trialgpt_freeze --output /tmp/repeat.json
          cmp candidate-partition.json /tmp/repeat.json
          sha256sum candidate-partition.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trialgpt-candidate-partition-aggregate
          path: candidate-partition.json
          if-no-files-found: error
          retention-days: 30
