name: External biomedical disease spans
on:
  pull_request:
    paths:
      - 'src/iatonoesis/external_ner.py'
      - 'tests/test_external_ner.py'
      - '.github/workflows/external-ner-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: external-ner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  external-ner-replay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONHASHSEED: '0'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Install isolated bounded CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'pytest==9.0.2' 'pytest-cov==7.0.0' 'transformers==4.57.1' 'huggingface-hub==0.36.0' 'safetensors==0.6.2'
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
      - name: Run contract tests and frozen external span replay
        run: |
          set -euo pipefail
          mkdir -p artifacts/external-ner
          python -m pip freeze > artifacts/external-ner/environment.txt
          git rev-parse HEAD >> artifacts/external-ner/environment.txt
          python -m pytest -q tests/test_external_ner.py --cov=iatonoesis.external_ner --cov=test_external_ner --cov-report=
          python -m coverage run --append --source=iatonoesis.external_ner -m iatonoesis.external_ner --output-dir artifacts/external-ner
          python -m coverage xml -o artifacts/external-ner/coverage.xml
          sha256sum artifacts/external-ner/freeze.json artifacts/external-ner/result.json > artifacts/external-ner/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: external-ner-replay-${{ github.sha }}
          path: artifacts/external-ner/
          if-no-files-found: error
          retention-days: 30
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: artifacts/external-ner/coverage.xml
          disable_search: true
          flags: external_ner
          use_oidc: true
          fail_ci_if_error: true
