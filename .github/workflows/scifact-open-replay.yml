name: SciFact open retrieval verification
on:
  pull_request:
    paths:
      - 'src/iatonoesis/scifact_open.py'
      - 'tests/test_scifact_open.py'
      - '.github/workflows/scifact-open-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  scifact-open-replay:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - name: Install isolated CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'pytest==9.0.2' 'pytest-cov==7.0.0' 'transformers==4.57.1' 'huggingface-hub==0.36.0' 'safetensors==0.6.2'
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
      - name: Verify source-boundary tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/scifact-open
          python -m pip freeze > artifacts/scifact-open/environment.txt
          git rev-parse HEAD >> artifacts/scifact-open/environment.txt
          python -m pytest -q tests/test_scifact_open.py --cov=iatonoesis.scifact_open --cov=test_scifact_open --cov-report=term
      - name: Replay whole-corpus factorial
        run: |
          set -euo pipefail
          python -m coverage run --append --source=iatonoesis.scifact_open -m iatonoesis.scifact_open --output artifacts/scifact-open/result.json
          sha256sum artifacts/scifact-open/result.json > artifacts/scifact-open/SHA256SUMS
          python -m coverage xml -o artifacts/scifact-open/coverage.xml --fail-under=90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scifact-open-aggregate
          path: artifacts/scifact-open/
          if-no-files-found: error
          retention-days: 30
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        if: success()
        with:
          files: artifacts/scifact-open/coverage.xml
          disable_search: true
          flags: external_scifact
          use_oidc: true
          fail_ci_if_error: true
